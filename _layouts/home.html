---
layout: default
---
<h1 class="page-heading">Posts</h1>

<div class="post-feed">
  {% for post in site.posts %}
  <article class="post-summary">
    <h2 class="post-summary-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time>
      {% if post.author %} &nbsp;&middot;&nbsp; {{ post.author }}{% endif %}
    </p>
    <p class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 60 }}</p>
    <a class="read-more" href="{{ post.url | relative_url }}">Read more &rarr;</a>
  </article>
  {% endfor %}
</div>
